name: Stable develop PR preview

on:
  deployment_status:
  workflow_dispatch:
  schedule:
    # Also handles a PR retargeted to develop after its deployment finished.
    - cron: '*/10 * * * *'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: stable-develop-preview
  cancel-in-progress: false

jobs:
  update-alias:
    if: github.event_name != 'deployment_status' || github.event.deployment_status.state == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # Store VERCEL_TOKEN here; restrict this environment to the default branch.
    environment: preview-alias
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Update shared preview from successful Vercel deployments
        run: node scripts/update-develop-preview.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
